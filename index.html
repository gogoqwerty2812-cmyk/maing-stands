<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA_agency — цифровая правая рука бизнеса</title>
<meta name="description" content="Соцсети, видео, звонки, рассылки, боты, реклама и сайты — забираем рутину, чтобы вы занимались бизнесом.">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<style>
  html{scroll-behavior:smooth}
  html,body{margin:0;background:#EFEFEF}
  section[id]{scroll-margin-top:12px}
  body{-webkit-font-smoothing:antialiased}
  .liquid-glass{background:rgba(255,255,255,.01);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative}
  .liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.2));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .liquid-glass-strong{background:rgba(255,255,255,.01);backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);box-shadow:inset 0 1px 1px rgba(255,255,255,.1)}
  @keyframes word-in{from{opacity:0;filter:blur(10px);transform:translateY(.45em)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
  .w-in{display:inline-block;opacity:0;animation:word-in .9s cubic-bezier(.16,1,.3,1) both}
  @keyframes feed-in{from{opacity:0;filter:blur(8px);transform:translateY(24px) scale(.96)}to{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}}
  .feed-item{animation:feed-in .7s cubic-bezier(.16,1,.3,1) both}
  @keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(242,101,34,.5)}50%{box-shadow:0 0 0 6px rgba(242,101,34,0)}}
  .live-dot{animation:pulse-dot 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.w-in,.feed-item{animation:none;opacity:1}}
  #fallback-bg{background:radial-gradient(ellipse at 78% 18%,rgba(255,95,3,.22),rgba(255,95,3,0) 55%),radial-gradient(ellipse at 15% 85%,rgba(255,95,3,.12),rgba(255,95,3,0) 50%),#EFEFEF}
</style>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
  "htm": "https://esm.sh/htm@3.1.1",
  "lucide-react": "https://esm.sh/lucide-react@0.460.0?deps=react@18.3.1",
  "shaders/react": "https://esm.sh/shaders@4.0.4/react?deps=react@18.3.1,react-dom@18.3.1"
} }
</script>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, { useState, useEffect, Component } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
import { ArrowRight, Clock, Menu, X, Inbox, PhoneCall, Bot, Globe, Send, MessageCircle } from 'lucide-react';
const html = htm.bind(React.createElement);
const EASE = 'duration-500 ease-[cubic-bezier(0.25,0.1,0.25,1)]';

// ---------- шейдерный фон (если WebGPU недоступен — мягкий градиент) ----------
class Safe extends Component { constructor(p) { super(p); this.state = { err: false }; } static getDerivedStateFromError() { return { err: true }; } render() { return this.state.err ? null : this.props.children; } }
function HeroShader() {
  const [S, setS] = useState(null);
  useEffect(() => { if (!navigator.gpu) return; import('shaders/react').then(m => setS(m)).catch(() => {}); }, []);
  if (!S) return null;
  const { Shader, Swirl, ChromaFlow, FlutedGlass, FilmGrain } = S;
  return html`<${Safe}><${Shader} className="w-full h-full">
    <${Swirl} colorA="#ffffff" colorB="#f0f0f0" detail=${1.7} />
    <${ChromaFlow} baseColor="#ffffff" downColor="#ff5f03" leftColor="#ff5f03" rightColor="#ff5f03" upColor="#ff5f03" momentum=${13} radius=${3.5} />
    <${FlutedGlass} aberration=${0.61} angle=${31} frequency=${8} highlight=${0.12} highlightSoftness=${0} lightAngle=${-90} refraction=${4} shape="rounded" softness=${1} speed=${0.15} />
    <${FilmGrain} strength=${0.05} />
  <//><//>`;
}

// ---------- общие кусочки ----------
const RollText = ({ text, h = 20 }) => html`
  <span className=${`relative block overflow-hidden h-[${h}px]`} style=${{ height: h + 'px' }}>
    <span className=${`flex flex-col transition-transform ${EASE} group-hover:-translate-y-1/2`}>
      <span className="block" style=${{ height: h + 'px', lineHeight: h + 'px' }}>${text}</span>
      <span className="block" style=${{ height: h + 'px', lineHeight: h + 'px' }}>${text}</span>
    </span>
  </span>`;

function OrangeButton({ text, href = '#contacts', big = false }) {
  return html`<a href=${href} className=${`group inline-flex items-center gap-3 self-start bg-[#F26522] hover:bg-[#e05a1a] text-white ${big ? 'text-[13px] sm:text-[14px] pl-5 sm:pl-6' : 'text-[13px] sm:text-[14px] pl-5'} font-medium rounded-full pr-2 py-2 transition-colors duration-300`}>
    <${RollText} text=${text} />
    <span className=${`flex items-center justify-center rounded-full bg-white ${big ? 'w-7 h-7 sm:w-8 sm:h-8' : 'w-7 h-7'}`}>
      <${ArrowRight} size=${15} className=${`text-[#F26522] transition-transform ${EASE} group-hover:-rotate-45`} />
    </span>
  </a>`;
}

const Spark = ({ className }) => html`<svg viewBox="0 0 24 24" className=${className} aria-hidden="true">
  <path d="M12 1.5c.5 4.9 2.3 8.6 7.2 9.6l3.3.7-3.3.7c-4.9 1-6.7 4.7-7.2 9.6-.5-4.9-2.3-8.6-7.2-9.6l-3.3-.7 3.3-.7C9.7 10.1 11.5 6.4 12 1.5Z"/>
  <path d="M19.5 1.5c.2 1.8.9 2.7 2.5 3-1.6.3-2.3 1.2-2.5 3-.2-1.8-.9-2.7-2.5-3 1.6-.3 2.3-1.2 2.5-3Z" opacity=".6"/></svg>`;

function useMoscowTime() {
  const fmt = () => new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Europe/Moscow' }).format(new Date());
  const [t, setT] = useState(fmt());
  useEffect(() => { const id = setInterval(() => setT(fmt()), 1000); return () => clearInterval(id); }, []);
  return t;
}


// ---------- анимации главного экрана ----------
const WORDS = ['рутину,', 'соцсети,', 'звонки,', 'рекламу,', 'сайты,', 'ботов,'];
function RotatingWord() {
  const [i, setI] = useState(0);
  const [widths, setWidths] = useState([]);
  const meas = React.useRef([]);
  useEffect(() => { const id = setInterval(() => setI(v => (v + 1) % WORDS.length), 2200); return () => clearInterval(id); }, []);
  useEffect(() => { const m = () => setWidths(meas.current.map(el => el ? el.getBoundingClientRect().width : 0));
    m(); addEventListener('resize', m); document.fonts && document.fonts.ready.then(m); return () => removeEventListener('resize', m); }, []);
  const w = widths[i];
  return html`<span className="relative inline-block overflow-hidden align-[-0.24em] transition-[width] duration-700 ease-[cubic-bezier(0.65,0,0.35,1)]" style=${{ height: '1.3em', width: w ? w + 'px' : 'auto' }}>
    <span className="flex flex-col transition-transform duration-700 ease-[cubic-bezier(0.65,0,0.35,1)]" style=${{ transform: `translateY(-${i * 1.3}em)` }}>
      ${WORDS.map((wd, k) => html`<span key=${wd} className="block whitespace-nowrap text-[#F26522]" style=${{ height: '1.3em', lineHeight: '1.3em' }}>${wd}</span>`)}
    </span>
    ${WORDS.map((wd, k) => html`<span key=${'m' + wd} ref=${el => meas.current[k] = el} aria-hidden="true" className="absolute left-0 top-0 invisible whitespace-nowrap">${wd}${' '}</span>`)}
  </span>`;
}
const Words = ({ text, start = 0 }) => text.split(' ').map((w, k) => html`<span key=${k} className="w-in" style=${{ animationDelay: (start + k * 0.07) + 's' }}>${w}${' '}</span>`);


const Tile = ({ bg, children }) => html`<span className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 shadow-[inset_0_0_0_1px_rgba(0,0,0,0.04)]" style=${{ background: bg }}>${children}</span>`;
const ICONS = {
  instagram: () => html`<${Tile} bg="linear-gradient(45deg,#f9a825 0%,#e1306c 50%,#833ab4 100%)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="#fff" stroke="none"/></svg><//>`,
  tiktok: () => html`<${Tile} bg="#111"><svg width="17" height="17" viewBox="0 0 24 24"><path d="M15.5 3c.4 2.4 1.9 4 4.5 4.3v3.2c-1.6 0-3.1-.5-4.4-1.4v6.2a5.8 5.8 0 1 1-5.8-5.8c.3 0 .6 0 .9.1v3.3a2.6 2.6 0 1 0 1.8 2.5V3h3Z" fill="#25F4EE" transform="translate(-.9 .6)"/><path d="M15.5 3c.4 2.4 1.9 4 4.5 4.3v3.2c-1.6 0-3.1-.5-4.4-1.4v6.2a5.8 5.8 0 1 1-5.8-5.8c.3 0 .6 0 .9.1v3.3a2.6 2.6 0 1 0 1.8 2.5V3h3Z" fill="#FE2C55" transform="translate(.9 -.4)"/><path d="M15.5 3c.4 2.4 1.9 4 4.5 4.3v3.2c-1.6 0-3.1-.5-4.4-1.4v6.2a5.8 5.8 0 1 1-5.8-5.8c.3 0 .6 0 .9.1v3.3a2.6 2.6 0 1 0 1.8 2.5V3h3Z" fill="#fff"/></svg><//>`,
  avito: () => html`<${Tile} bg="#fff"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="16.5" cy="7" r="4.5" fill="#00AAFF"/><circle cx="7.5" cy="9" r="3" fill="#97CF26"/><circle cx="16" cy="16.5" r="3.2" fill="#A169F7"/><circle cx="8" cy="17" r="2" fill="#FF6163"/></svg><//>`,
  whatsapp: () => html`<${Tile} bg="#25D366"><${MessageCircle} size=${18} color="#fff" strokeWidth=${2.2} /><//>`,
  telegram: () => html`<${Tile} bg="#2AABEE"><${Send} size=${16} color="#fff" strokeWidth=${2.2} style=${{ marginLeft: '-2px' }} /><//>`,
  lead: () => html`<${Tile} bg="#F26522"><${Inbox} size=${17} color="#fff" strokeWidth=${2.2} /><//>`,
  phone: () => html`<${Tile} bg="#16A34A"><${PhoneCall} size=${16} color="#fff" strokeWidth=${2.2} /><//>`,
  bot: () => html`<${Tile} bg="#6D5DF6"><${Bot} size=${18} color="#fff" strokeWidth=${2.1} /><//>`,
  site: () => html`<${Tile} bg="#111827"><${Globe} size=${17} color="#fff" strokeWidth=${2} /><//>`,
};

const FEED = [
  ['instagram', 'Пост опубликован', 'Инстаграм · карусель «7 видов вывесок»'],
  ['lead', 'Новая заявка с сайта', 'Вывеска для кофейни · Москва'],
  ['phone', 'Звонок завершён', 'Клиент записан на замер в четверг'],
  ['bot', 'Бот ответил клиенту', '«Пришлите фото фасада — посчитаем»'],
  ['tiktok', 'Ролик готов', 'ТикТок · «Стенд за одну ночь»'],
  ['avito', 'Объявления обновлены', 'Авито · тексты, фото и цены'],
  ['whatsapp', 'Рассылка отправлена', 'WhatsApp · постоянные клиенты'],
  ['site', 'Правки на сайте', 'Обновлены цены и фото'],
  ['telegram', 'Отчёт за неделю', 'Пришёл вам в Telegram'],
];
function ActivityFeed({ mobile = false }) {
  const [n, setN] = useState(1);
  useEffect(() => { const id = setInterval(() => setN(v => v + 1), 2100); return () => clearInterval(id); }, []);
  const items = []; for (let k = Math.max(0, n - (mobile ? 2 : 4)); k < n; k++) items.push(k);
  return html`<div className=${mobile ? "lg:hidden flex flex-col gap-2 mb-8 max-w-[360px]" : "hidden lg:flex absolute right-12 bottom-20 z-20 w-[330px] flex-col gap-2.5"}>
    <div className="flex items-center gap-2 text-[12px] text-gray-600 mb-1 pl-1"><span className="live-dot w-2 h-2 rounded-full bg-[#F26522]"></span> Сейчас работаем за клиентов</div>
    ${items.map((k, idx) => { const [ic, t, d] = FEED[k % FEED.length]; const age = items.length - 1 - idx;
      return html`<div key=${k} className="feed-item bg-white/75 backdrop-blur-md rounded-2xl px-4 py-3 shadow-[0_8px_30px_rgba(0,0,0,0.08)] flex items-center gap-3 transition-opacity duration-700" style=${{ opacity: 1 - age * 0.22 }}>
        ${ICONS[ic]()}
        <span className="min-w-0"><span className="block text-[13px] font-semibold text-gray-900">${t}</span><span className="block text-[12px] text-gray-600 truncate">${d}</span></span>
        <span className="ml-auto text-[11px] text-gray-400 shrink-0">${age === 0 ? 'сейчас' : age + ' мин'}</span>
      </div>`; })}
  </div>`;
}

const NAV = [['Главная', '#top'], ['Услуги', '#services'], ['Проекты', '#projects'], ['Контакты', '#contacts']];

// ---------- 1. Главный экран ----------
function Hero() {
  const time = useMoscowTime();
  const [open, setOpen] = useState(false);
  useEffect(() => { document.body.style.overflow = open ? 'hidden' : ''; }, [open]);
  return html`
  <section className="relative min-h-screen bg-[#EFEFEF] flex flex-col overflow-hidden">
    <div id="fallback-bg" className="absolute inset-0 z-0"></div>
    <div className="absolute inset-0 z-10 pointer-events-none"><${HeroShader} /></div>

    <div className="relative z-20 w-full max-w-[1440px] mx-auto p-2 sm:p-3">
      <nav className="bg-white rounded-full p-[5px] flex items-center justify-between">
        <div className="flex items-center gap-6">
          <a href="#top" className="w-9 h-9 sm:w-10 sm:h-10 bg-gray-900 rounded-full flex items-center justify-center text-white text-[10px] sm:text-[11px] font-bold tracking-tight">IA</a>
          <div className="hidden md:flex items-center gap-6">
            ${NAV.map(([l, h]) => html`<a key=${l} href=${h} className="text-[14px] text-gray-900 hover:text-gray-500 transition-colors duration-300">${l}</a>`)}
          </div>
        </div>
        <div className="hidden md:flex items-center gap-5">
          <span className="hidden lg:inline text-[13px] text-gray-600">Берём новые проекты на ноябрь</span>
          <span className="flex items-center gap-1.5 text-[13px] text-gray-600"><${Clock} size=${14} /> ${time} в Москве</span>
          <a href="#contacts" className="group flex items-center gap-3 bg-gray-900 text-white text-[13px] font-medium rounded-full pl-5 pr-2 py-2">
            <${RollText} text="Обсудить задачу" />
            <span className="w-6 h-6 rounded-full bg-white flex items-center justify-center"><${ArrowRight} size=${13} className=${`text-gray-900 transition-transform ${EASE} group-hover:-rotate-45`} /></span>
          </a>
        </div>
        <button type="button" onClick=${() => setOpen(!open)} className="md:hidden flex items-center gap-2 bg-gray-900 text-white text-[13px] font-medium rounded-full pl-4 pr-3 py-2.5">
          ${open ? 'Закрыть' : 'Меню'} ${open ? html`<${X} size=${16} />` : html`<${Menu} size=${16} />`}
        </button>
      </nav>
    </div>

    <div className=${`fixed inset-0 z-50 md:hidden transition-[visibility] duration-500 ${open ? 'visible' : 'invisible pointer-events-none'}`}>
      <div onClick=${() => setOpen(false)} className=${`absolute inset-0 bg-black/60 transition-opacity duration-500 ${open ? 'opacity-100' : 'opacity-0'}`}></div>
      <div className=${`absolute left-0 right-0 bottom-0 mx-3 mb-3 bg-white rounded-2xl p-6 transition-transform duration-500 ease-[cubic-bezier(0.32,0.72,0,1)] ${open ? 'translate-y-0' : 'translate-y-full'}`}>
        <span className="inline-flex items-center gap-1.5 text-[12px] text-gray-600 bg-gray-100 rounded-full px-3 py-1"><${Clock} size=${12} /> ${time} в Москве</span>
        <div className="flex flex-col gap-1 mt-6 mb-8">
          ${NAV.map(([l, h]) => html`<a key=${l} href=${h} onClick=${() => setOpen(false)} className="text-[28px] sm:text-[32px] font-medium text-gray-900 leading-tight">${l}</a>`)}
        </div>
        <a href="#contacts" onClick=${() => setOpen(false)} className="flex items-center justify-between bg-[#F26522] text-white text-[15px] font-medium rounded-full pl-6 pr-2 py-2">
          Начать проект <span className="w-9 h-9 rounded-full bg-white flex items-center justify-center"><${ArrowRight} size=${16} className="text-[#F26522]" /></span>
        </a>
      </div>
    </div>

    <div className="flex-1"></div>
    <${ActivityFeed} />
    <div className="relative z-20 w-full max-w-[1440px] mx-auto px-5 sm:px-8 lg:px-12 pb-10 sm:pb-16 lg:pb-20">
      <${ActivityFeed} mobile=${true} />
      <p className="w-in text-[13px] sm:text-[14px] text-gray-900 tracking-wide mb-5 sm:mb-8">IA_agency</p>
      <h1 className="text-[clamp(2.05rem,9.4vw,4.2rem)] sm:text-[clamp(2.5rem,5vw,4.2rem)] font-medium leading-[1.08] tracking-[-0.03em] text-gray-900">
        <span className="w-in" style=${{ animationDelay: '.1s' }}>Мы </span><span className="w-in" style=${{ animationDelay: '.17s' }}>забираем </span><span className="w-in" style=${{ animationDelay: '.24s' }}><${RotatingWord} /></span><br className="hidden sm:block" />${Words({ text: 'чтобы вы занимались тем,', start: .34 })}<br className="hidden sm:block" />${Words({ text: 'что приносит деньги.', start: .62 })}
      </h1>
      <div className="w-in mt-8 sm:mt-12 flex flex-col sm:flex-row gap-4 sm:gap-5 sm:items-center" style=${{ animationDelay: '.9s' }}>
        <${OrangeButton} text="Начать проект" big=${true} />
        <span className="inline-flex self-start items-center gap-2.5 bg-white rounded-[4px] px-3 py-2 shadow-[0_2px_8px_rgba(0,0,0,0.08)] hover:shadow-[0_4px_16px_rgba(0,0,0,0.12)] transition-shadow duration-300">
          <${Spark} className="w-5 h-5 sm:w-6 sm:h-6 fill-current text-[#E8704E]" />
          <span className="text-[13px] sm:text-[14px] font-medium text-gray-900">Работаем с нейросетями</span>
          <span className="text-[10px] sm:text-[11px] bg-gray-900 text-white px-1.5 sm:px-2 py-0.5 rounded">AI</span>
        </span>
      </div>
    </div>
  </section>`;
}

// ---------- 2. Услуги ----------
const SERVICES = [
  ['Соцсети', ['Контент-план', 'Посты и карусели', 'Сторис и Reels', 'Подписи и хэштеги', 'Оформление профиля', 'Публикация по расписанию', 'Ответы в комментариях']],
  ['Видео', ['Идеи и сценарии', 'Монтаж из ваших фото и видео', 'Анимация', 'Озвучка голосом', 'Субтитры и музыка', 'ТикТок, Reels, Shorts']],
  ['Реклама', ['Закуп рекламы в Telegram-каналах', 'Реклама у блогеров', 'Таргет в соцсетях', 'Креативы и баннеры', 'Отчёты по заявкам']],
  ['Авито и маркетплейсы', ['Десятки объявлений за день', 'Автозагрузка XML/Excel', 'Продающие тексты', 'Обработка фото', 'Обновление цен', 'Карточки товаров']],
  ['Звонки и клиенты', ['Прозвон клиентской базы', 'Холодные звонки по скрипту', 'Обработка заявок', 'Переписка в мессенджерах', 'Напоминания и сбор отзывов']],
  ['Рассылки', ['WhatsApp и Telegram', 'E-mail и SMS', 'Акции и напоминания', 'Сегментация базы', 'Отчёт по откликам']],
  ['Боты и автоматизация', ['Чат-бот для заявок', 'Бот записи', 'Автоответы', 'Уведомления о заказах', 'Связка CRM, таблиц и мессенджеров', 'Автоматические отчёты']],
  ['Сайты', ['Правки текстов и цен', 'Редизайн — красивее и современнее', 'Сайт или лендинг с нуля', 'Формы заявок и онлайн-запись', 'Адаптация под телефоны', 'Аналитика']],
  ['Презентации и документы', ['Презентация компании', 'Коммерческие предложения', 'PDF-каталоги и прайсы', 'Шаблоны писем и договоров', 'Таблицы и отчёты']],
  ['Тексты', ['Тексты для сайта', 'Описания услуг и товаров', 'Посты и статьи', 'Письма клиентам']],
  ['Дизайн', ['Логотип и фирменный стиль', 'Баннеры и креативы', 'Обработка фото', 'Шаблоны для соцсетей']],
  ['Нейросети', ['Тексты и картинки с ИИ', 'Озвучка нейросетью', 'Видео с ИИ', 'Внедрение ИИ в процессы', 'Обучение команды']],
];

function Badge({ n, label, border = 'border-gray-200' }) {
  return html`<div className="px-5 sm:px-8 lg:px-12 flex items-center gap-3 mb-6 sm:mb-8">
    <span className="w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-gray-900 text-white text-[11px] sm:text-[12px] font-semibold flex items-center justify-center">${n}</span>
    <span className=${`text-[12px] sm:text-[13px] font-medium border ${border} rounded-full px-3 sm:px-4 py-1 sm:py-1.5 text-gray-900`}>${label}</span>
  </div>`;
}

function Services() {
  const [openSvc, setOpenSvc] = useState(0);
  const total = SERVICES.reduce((s, [, i]) => s + i.length, 0);
    return html`
